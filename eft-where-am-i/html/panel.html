<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where Am I Panel</title>
  <script src="../assets/js/i18next.min.js"></script>
  <script src="../assets/js/i18nextHttpBackend.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../assets/css/tailwind.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden; /* 스크롤바 방지 */
    }
    .scale-stack {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .1rem .4rem;
      padding-inline: .3rem;
      white-space: nowrap;
    }
    .scale-control { display: flex; align-items: center; justify-content: stretch; gap: .2rem; min-width: 0; }
    .scale-control label {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: clamp(.6rem, .55vw, .75rem) !important;
    }
    .scale-control input { flex: 1 1 2.5rem; width: 100%; min-width: 2.25rem; padding: 0; accent-color: #8d7a50; }
    .scale-control output {
      flex: 0 0 2.7rem;
      min-width: 2.7rem;
      font-size: clamp(.6rem, .55vw, .75rem) !important;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    html.portrait-mode body > .grid {
      grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
      column-gap: .5rem !important;
    }
    html.portrait-mode button {
      font-size: 50% !important;
      line-height: 1.1 !important;
      padding: .125rem .25rem !important;
      width: 50% !important;
    }
    html.portrait-mode .scale-stack {
      grid-column: 4 / 6 !important;
      column-gap: .75rem;
      padding-inline: .5rem;
    }
    html.portrait-mode .scale-control input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      flex-basis: 5.5rem;
      height: 1.35rem;
      min-width: 4.5rem;
    }
    html.portrait-mode .scale-control input[type="range"]::-webkit-slider-runnable-track {
      background: #b8ad95;
      border-radius: 999px;
      height: .42rem;
    }
    html.portrait-mode .scale-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      background: #8d7a50;
      border: 1px solid #55492f;
      border-radius: 50%;
      height: 1.1rem;
      margin-top: -.34rem;
      width: 1.1rem;
    }
  </style>
</head>
<body class="flex items-center justify-center bg-gray-200 w-full h-full">
  <div class="grid grid-cols-4 grid-rows-3 gap-x-6 gap-y-0 w-full h-full">

    <!-- Cell 1: Map Selection -->
    <section class="flex justify-center items-center w-full" style="grid-column: 1; grid-row: 1;">
      <label
        id="mapSelectionLabel"
        class="text-sm lg:text-base xl:text-lg font-semibold"
      >
        Select The Map
      </label>
    </section>
    <section class="flex justify-center items-center w-full" style="grid-column: 1; grid-row: 2;">
      <select
        id="mapSelect"
        onchange="mapSelected()"
        class="border rounded mx-4 px-2 py-0.5 text-xs lg:text-sm xl:text-base font-medium bg-white w-full"
      >
        <!-- C#에서 맵 목록 추가 -->
      </select>
    </section>

    <!-- Cell 2: Hide/Show and Full Screen -->
    <section class="flex justify-center items-center w-full" style="grid-column: 2; grid-row: 1;">
      <button
        id="hideShowPanelsButton"
        onclick="hideShowPanel()"
        class="bg-white border rounded py-1 px-2 text-xs lg:text-sm xl:text-base font-medium hover:bg-gray-100 w-full"
      >
        Hide/Show Panels
      </button>
    </section>
    <section class="flex justify-center items-center w-full" style="grid-column: 2; grid-row: 2;">
      <button
        id="fullScreenButton"
        onclick="fullScreen()"
        class="bg-white border rounded py-1 px-2 text-xs lg:text-sm xl:text-base font-medium hover:bg-gray-100 w-full"
      >
        Full Screen
      </button>
    </section>

    <!-- Cell 3: Screenshot Detection -->
    <section class="flex justify-center items-center w-full" style="grid-column: 3; grid-row: 1;">
      <div class="flex items-center">
        <input type="checkbox" id="autoDetect" class="w-3 h-3 lg:w-4 lg:h-4 xl:w-5 xl:h-5 mr-1" onchange="checkboxChanged()">
        <label
          id="autoScreenshotDetectionLabel"
          for="autoDetect"
          class="text-xs lg:text-sm xl:text-base font-medium"
        >
          Auto Screenshot Detection
        </label>
      </div>
    </section>
    <section class="flex justify-center items-center w-full" style="grid-column: 3; grid-row: 2;">
      <button
        id="forceRunButton"
        onclick="forceRun()"
        class="bg-white border rounded py-1 px-2 text-xs lg:text-sm xl:text-base font-medium hover:bg-gray-100 w-full"
      >
        Force Run
      </button>
    </section>

    <!-- Cell 4: Auto Map Detection and Links -->
    <section class="flex justify-center items-center w-full" style="grid-column: 4; grid-row: 1;">
      <div class="flex items-center">
        <input type="checkbox" id="autoMapDetect" class="w-3 h-3 lg:w-4 lg:h-4 xl:w-5 xl:h-5 mr-1" onchange="autoMapToggle()">
        <label
          id="autoMapDetectionLabel"
          for="autoMapDetect"
          class="text-xs lg:text-sm xl:text-base font-medium"
        >
          Auto Map Detection
        </label>
      </div>
    </section>
    <section class="flex justify-center items-center w-full gap-3" style="grid-column: 4; grid-row: 2;">
      <a
        id="howToUseLink"
        href="https://github.com/karpitony/eft-where-am-i/blob/main/README.md"
        class="text-blue-600 hover:underline text-xs lg:text-sm xl:text-base font-semibold"
      >
        How To Use
      </a>
      <a
        id="bugLink"
        href="https://github.com/karpitony/eft-where-am-i/issues"
        class="text-blue-600 hover:underline text-xs lg:text-sm xl:text-base font-semibold"
      >
        Bug Report
      </a>
    </section>

    <!-- Row 3: Auto Panning and Floor DB Editor (Debug mode only) -->
    <section class="flex justify-center items-center w-full" style="grid-column: 1; grid-row: 3;">
      <div class="flex items-center">
        <input type="checkbox" id="autoPanning" class="w-3 h-3 lg:w-4 lg:h-4 xl:w-5 xl:h-5 mr-1" onchange="autoPanningToggle()">
        <label
          id="autoPanningLabel"
          for="autoPanning"
          class="text-xs lg:text-sm xl:text-base font-medium"
        >
          Auto Panning
        </label>
      </div>
    </section>
    <section class="flex justify-center items-center w-full" style="grid-column: 2; grid-row: 3;">
      <button
        id="floorDbEditorButton"
        onclick="toggleFloorEditMode()"
        style="display: none;"
        class="bg-white border rounded py-1 px-2 text-xs lg:text-sm xl:text-base font-medium hover:bg-gray-100 w-full"
      >
        Floor DB Editor
      </button>
    </section>
    <section class="flex justify-center items-center w-full" style="grid-column: 3; grid-row: 3;">
      <div class="flex items-center">
        <input type="checkbox" id="autoScreenshotCleanup" class="w-3 h-3 lg:w-4 lg:h-4 xl:w-5 xl:h-5 mr-1" onchange="autoScreenshotCleanupToggle()">
        <label id="autoScreenshotCleanupLabel" for="autoScreenshotCleanup"
          class="text-xs lg:text-sm xl:text-base font-medium">
          Auto Screenshot Cleanup
        </label>
      </div>
    </section>
    <section class="scale-stack w-full" style="grid-column: 4; grid-row: 3;">
      <div class="scale-control">
        <label id="popupOpacityLabel" for="popupOpacitySlider" class="text-xs lg:text-sm xl:text-base font-medium">Popup Opacity</label>
        <input id="popupOpacitySlider" type="range" min="30" max="100" step="5" value="100" oninput="previewPopupOpacity()" onchange="commitPopupOpacity()">
        <output id="popupOpacityValue" for="popupOpacitySlider" class="text-xs lg:text-sm xl:text-base font-medium">100%</output>
      </div>
      <div class="scale-control">
        <label id="fontScaleLabel" for="fontScaleSlider" class="text-xs lg:text-sm xl:text-base font-medium">Font Size</label>
        <input id="fontScaleSlider" type="range" min="50" max="150" step="5" value="100" oninput="previewFontScale()" onchange="commitFontScale()">
        <output id="fontScaleValue" for="fontScaleSlider" class="text-xs lg:text-sm xl:text-base font-medium">100%</output>
      </div>
      <div class="scale-control">
        <label id="iconScaleLabel" for="iconScaleSlider" class="text-xs lg:text-sm xl:text-base font-medium">Icon Size</label>
        <input id="iconScaleSlider" type="range" min="50" max="650" step="5" value="100" oninput="previewIconScale()" onchange="commitIconScale()">
        <output id="iconScaleValue" for="iconScaleSlider" class="text-xs lg:text-sm xl:text-base font-medium">100%</output>
      </div>
      <div class="scale-control">
        <label id="routeLineWidthLabel" for="routeLineWidthSlider" class="text-xs lg:text-sm xl:text-base font-medium">Route Width</label>
        <input id="routeLineWidthSlider" type="range" min="0.5" max="8" step="0.5" value="1.5" oninput="previewRouteLineWidth()" onchange="commitRouteLineWidth()">
        <output id="routeLineWidthValue" for="routeLineWidthSlider" class="text-xs lg:text-sm xl:text-base font-medium">1.5px</output>
      </div>
    </section>
  </div>

  <script>
    function setPortraitMode(enabled) {
      document.documentElement.classList.toggle('portrait-mode', Boolean(enabled));
    }

    i18next
      .use(i18nextHttpBackend)
      .init({
        lng: "en",
        fallbackLng: "en",
        debug: false,
        backend: {
          loadPath: "https://appassets/{{lng}}.json"
        }
      })
      .then(() => {
        updateContent();
      })
      .catch(err => console.error("i18next 초기화 오류:", err));

    // DOM에 번역 적용 함수
    function updateContent() {
      document.getElementById('mapSelectionLabel').textContent = i18next.t('mapSelectionLabel');
      document.getElementById('autoScreenshotDetectionLabel').textContent = i18next.t('autoScreenshotDetectionLabel');
      document.getElementById('hideShowPanelsButton').textContent = i18next.t('hideShowPanelsButton');
      document.getElementById('fullScreenButton').textContent = i18next.t('fullScreenButton');
      document.getElementById('forceRunButton').textContent = i18next.t('forceRunButton');
      document.getElementById('howToUseLink').textContent = i18next.t('howToUseLink');
      document.getElementById('bugLink').textContent = i18next.t('bugLink');
      document.getElementById('autoMapDetectionLabel').textContent = i18next.t('autoMapDetectionLabel');
      document.getElementById('autoPanningLabel').textContent = i18next.t('autoPanningLabel');
      document.getElementById('floorDbEditorButton').textContent = i18next.t('floorDbEditorButton');
      document.getElementById('autoScreenshotCleanupLabel').textContent = i18next.t('autoScreenshotCleanupLabel');
      document.getElementById('popupOpacityLabel').textContent = i18next.t('popupOpacityLabel');
      document.getElementById('fontScaleLabel').textContent = i18next.t('fontScaleLabel');
      document.getElementById('iconScaleLabel').textContent = i18next.t('iconScaleLabel');
      document.getElementById('routeLineWidthLabel').textContent = i18next.t('routeLineWidthLabel');
    }

    function setTheme(theme) {
      try {
        document.body.classList.toggle('theme-dark', theme === 'dark');
      } catch (error) {
        console.error("setTheme 오류 발생: ", error);
      }
    }

    // C#에서 호출하는 함수: 언어 설정
    function setLanguage(language) {
      try {
        // 언어 선택 <select> 요소의 값을 변경
        const select = document.getElementById('languageSelect');
        if(select) {
          select.value = language;
        }
        // i18next를 통해 언어 변경 (비동기 처리는 필요시 then()으로 체이닝 가능)
        i18next.changeLanguage(language)
          .then(() => {
            updateContent(); // DOM 텍스트 업데이트
          })
          .catch(error => {
            console.error("i18next changeLanguage 오류 발생:", error);
          });
        console.log("Language set to:", language); // 디버그용 출력
      } catch (error) {
        console.error("setLanguage 오류 발생: ", error);
      }
    }

    // C#에서 호출하는 함수: 맵 목록 채우기
    function populateMapList(mapsJson, selectedMap) {
      try {
        const maps = JSON.parse(mapsJson);
        const select = document.getElementById('mapSelect');
        select.innerHTML = '';

        maps.forEach(map => {
            const option = document.createElement('option');
            const value = typeof map === 'string' ? map : map.value;
            const label = typeof map === 'string' ? map : map.label;
            option.value = value;
            option.textContent = label;
            select.appendChild(option);
        });

        if (selectedMap) {
          select.value = selectedMap;
        }
        console.log("기본 선택된 맵:", selectedMap); // 디버그용 출력
      } catch (error) {
          console.error("populateMapList 오류: ", error);
      }
    }

    // C#에서 호출하는 함수: 초기 체크박스 상태 설정
    function setCheckboxState(isChecked) {
      try {
          const checkbox = document.getElementById('autoDetect');
          checkbox.checked = isChecked;
          console.log("Checkbox state set to:", isChecked);  // 디버그용 출력
      } catch (error) {
          console.error("setCheckboxState 오류 발생: ", error);
      }
    }

    // 맵 선택 시 C#으로 상태 전달
    function mapSelected() {
      const selectedMap = document.getElementById('mapSelect').value;
      console.log("Selected map:", selectedMap);  // 디버그용 콘솔 출력
      window.chrome.webview.postMessage(JSON.stringify({ action: 'map-selected', map: selectedMap }));
    }

    // 체크박스 상태 변경 시 C#으로 상태 전달
    function checkboxChanged() {
      const isChecked = document.getElementById('autoDetect').checked;
      console.log("Checkbox state changed to:", isChecked);  // 디버그용 콘솔 출력
      window.chrome.webview.postMessage(JSON.stringify({ action: 'checkbox-updated', isChecked: isChecked }));
    }

    // Hide/Show Panel 버튼 클릭 시
    function hideShowPanel() {
      window.chrome.webview.postMessage(JSON.stringify({
          action: 'hide-show-panel'
      }));
    }

    // Full Screen 버튼 클릭 시
    function fullScreen() {
      window.chrome.webview.postMessage(JSON.stringify({
          action: 'full-screen'
      }));
    }

    // Force Run 버튼 클릭 시
    function forceRun() {
      window.chrome.webview.postMessage(JSON.stringify({
          action: 'force-run'
      }));
    }

    // Auto Map Detection 토글
    function autoMapToggle() {
      const isChecked = document.getElementById('autoMapDetect').checked;
      window.chrome.webview.postMessage(JSON.stringify({ action: 'auto-map-toggle', isChecked: isChecked }));
    }

    // C#에서 호출: 자동 맵 감지 체크박스 상태 설정
    function setAutoMapCheckboxState(isChecked) {
      try {
        const checkbox = document.getElementById('autoMapDetect');
        checkbox.checked = isChecked;
      } catch (error) {
        console.error("setAutoMapCheckboxState error:", error);
      }
    }

    // Auto Panning 토글
    function autoPanningToggle() {
      const isChecked = document.getElementById('autoPanning').checked;
      window.chrome.webview.postMessage(JSON.stringify({ action: 'auto-panning-toggle', isChecked: isChecked }));
    }

    // C#에서 호출: 자동 패닝 체크박스 상태 설정
    function setAutoPanningCheckboxState(isChecked) {
      try {
        const checkbox = document.getElementById('autoPanning');
        checkbox.checked = isChecked;
      } catch (error) {
        console.error("setAutoPanningCheckboxState error:", error);
      }
    }

    // Auto Screenshot Cleanup 토글
    function autoScreenshotCleanupToggle() {
      const isChecked = document.getElementById('autoScreenshotCleanup').checked;
      window.chrome.webview.postMessage(JSON.stringify({
        action: 'auto-screenshot-cleanup-toggle', isChecked: isChecked
      }));
    }

    // C#에서 호출: 스크린샷 자동 삭제 체크박스 상태 설정
    function setAutoScreenshotCleanupCheckboxState(isChecked) {
      try {
        document.getElementById('autoScreenshotCleanup').checked = isChecked;
      } catch (error) {
        console.error("setAutoScreenshotCleanupCheckboxState error:", error);
      }
    }

    function setScaleControls(fontScale, iconScale, popupOpacity, routeLineWidth) {
      const fontPercent = Math.min(150, Math.max(50, Math.round((Number(fontScale) || 1) * 100)));
      const iconPercent = Math.min(650, Math.max(50, Math.round((Number(iconScale) || 1) * 100)));
      const popupPercent = Math.min(100, Math.max(30, Math.round((Number(popupOpacity) || 1) * 100)));
      const lineWidth = Math.min(8, Math.max(0.5, Number(routeLineWidth) || 1.5));
      document.getElementById('popupOpacitySlider').value = popupPercent;
      document.getElementById('popupOpacityValue').textContent = popupPercent + '%';
      document.getElementById('fontScaleSlider').value = fontPercent;
      document.getElementById('fontScaleValue').textContent = fontPercent + '%';
      document.getElementById('iconScaleSlider').value = iconPercent;
      document.getElementById('iconScaleValue').textContent = iconPercent + '%';
      document.getElementById('routeLineWidthSlider').value = lineWidth;
      document.getElementById('routeLineWidthValue').textContent = lineWidth.toFixed(1) + 'px';
    }

    function previewPopupOpacity() {
      const percent = Number(document.getElementById('popupOpacitySlider').value);
      document.getElementById('popupOpacityValue').textContent = percent + '%';
      window.chrome.webview.postMessage(JSON.stringify({ action: 'popup-opacity-preview', opacity: percent / 100 }));
    }

    function commitPopupOpacity() {
      const percent = Number(document.getElementById('popupOpacitySlider').value);
      window.chrome.webview.postMessage(JSON.stringify({ action: 'popup-opacity-changed', opacity: percent / 100 }));
    }

    function previewFontScale() {
      const percent = Number(document.getElementById('fontScaleSlider').value);
      document.getElementById('fontScaleValue').textContent = percent + '%';
      window.chrome.webview.postMessage(JSON.stringify({ action: 'font-scale-preview', scale: percent / 100 }));
    }

    function commitFontScale() {
      const percent = Number(document.getElementById('fontScaleSlider').value);
      window.chrome.webview.postMessage(JSON.stringify({ action: 'font-scale-changed', scale: percent / 100 }));
    }

    function previewIconScale() {
      const percent = Number(document.getElementById('iconScaleSlider').value);
      document.getElementById('iconScaleValue').textContent = percent + '%';
      window.chrome.webview.postMessage(JSON.stringify({ action: 'icon-scale-preview', scale: percent / 100 }));
    }

    function commitIconScale() {
      const percent = Number(document.getElementById('iconScaleSlider').value);
      window.chrome.webview.postMessage(JSON.stringify({ action: 'icon-scale-changed', scale: percent / 100 }));
    }

    function previewRouteLineWidth() {
      const width = Number(document.getElementById('routeLineWidthSlider').value);
      document.getElementById('routeLineWidthValue').textContent = width.toFixed(1) + 'px';
      window.chrome.webview.postMessage(JSON.stringify({ action: 'route-line-width-preview', width }));
    }

    function commitRouteLineWidth() {
      const width = Number(document.getElementById('routeLineWidthSlider').value);
      window.chrome.webview.postMessage(JSON.stringify({ action: 'route-line-width-changed', width }));
    }

    // C#에서 호출: 디버그 모드 설정 (Floor DB Editor 버튼 표시/숨김)
    function setDebugMode(isDebug) {
      try {
        const btn = document.getElementById('floorDbEditorButton');
        btn.style.display = isDebug ? 'block' : 'none';
      } catch (error) {
        console.error("setDebugMode error:", error);
      }
    }

    // Floor Zone Edit Mode 토글
    function toggleFloorEditMode() {
      window.chrome.webview.postMessage(JSON.stringify({ action: 'toggle-floor-edit-mode' }));
    }

    // How To Use 링크
    document.querySelector('#howToUseLink').addEventListener('click', function(e) {
      e.preventDefault();
      window.chrome.webview.postMessage(JSON.stringify({
        action: 'link-clicked',
        url: this.href
      }));
    });

    // Bug Report 링크
    document.querySelector('#bugLink').addEventListener('click', function(e) {
      e.preventDefault();
      window.chrome.webview.postMessage(JSON.stringify({
        action: 'link-clicked',
        url: this.href
      }));
    });
  </script>
</body>
</html>
