name: Release App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: eft-where-am-i/package-lock.json

      - name: Validate release version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          [xml]$project = Get-Content -Raw "eft-where-am-i/eft-where-am-i.csproj"
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($tagVersion -ne $projectVersion) {
            throw "Tag version $tagVersion does not match project version $projectVersion."
          }
          "RELEASE_VERSION=$tagVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies and build CSS
        working-directory: eft-where-am-i
        run: |
          npm ci
          npm run build:css

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 0.0.1298
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish eft-where-am-i/eft-where-am-i.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$env:RELEASE_VERSION `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -o ./publish_output

          if (-not (Test-Path -LiteralPath "./publish_output/WHERE THE FUCK AM I.exe")) {
            throw "Published application executable is missing."
          }

      - name: Build installer and portable packages
        shell: pwsh
        run: |
          vpk pack `
            -u where-the-fuck-am-i `
            -v $env:RELEASE_VERSION `
            -c win-sc `
            -p ./publish_output `
            -e "WHERE THE FUCK AM I.exe" `
            --packTitle "WHERE THE FUCK AM I" `
            --packAuthors "Gen7920335" `
            -i ./eft-where-am-i/eft-where-am-i.ico `
            -o ./release_output

          $setup = @(Get-ChildItem -LiteralPath "./release_output" -Filter "*-Setup.exe")
          $portable = @(Get-ChildItem -LiteralPath "./release_output" -Filter "*-Portable.zip")
          if ($setup.Count -ne 1 -or $portable.Count -ne 1) {
            throw "Expected one installer and one portable archive; found $($setup.Count) installer(s) and $($portable.Count) portable archive(s)."
          }
          $portableEntries = tar -tf $portable[0].FullName
          if ($portableEntries -notcontains "WHERE THE FUCK AM I.exe" -or $portableEntries -notcontains "current/WHERE THE FUCK AM I.exe") {
            throw "Portable archive is missing its launcher or branded application executable."
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = Get-ChildItem -LiteralPath "./release_output" -Filter "*-Setup.exe"
          $portable = Get-ChildItem -LiteralPath "./release_output" -Filter "*-Portable.zip"
          @"
          ## 다운로드

          - **권장:** ``$($portable.Name)`` — 압축 해제 후 ``WHERE THE FUCK AM I.exe`` 실행
          - **설치형:** ``$($setup.Name)`` — 설치 마법사로 설치

          두 파일 모두 Windows x64용이며 .NET Desktop Runtime을 포함합니다.
          "@ | Set-Content -LiteralPath "./release-notes.md" -Encoding utf8

          gh release create "${{ github.ref_name }}" `
            "$($setup.FullName)" `
            "$($portable.FullName)" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "WHERE THE FUCK AM I ${{ github.ref_name }}" `
            --notes-file "./release-notes.md" `
            --verify-tag
