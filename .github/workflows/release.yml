name: Release Portable App

on:
  push:
    tags:
      - 'v*'

jobs:
  build_portable:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: eft-where-am-i
        run: npm ci

      - name: Publish self-contained portable app
        shell: pwsh
        run: |
          dotnet publish eft-where-am-i/eft-where-am-i.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o ./publish_output

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $archive = "WHERE-THE-FUCK-AM-I-v$version-win-x64-portable.zip"
          Compress-Archive -Path './publish_output/*' -DestinationPath $archive -CompressionLevel Optimal
          "PORTABLE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload portable ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:PORTABLE_ARCHIVE --clobber
          } else {
            gh release create $tag $env:PORTABLE_ARCHIVE --title "WHERE THE FUCK AM I $tag" --generate-notes
          }
